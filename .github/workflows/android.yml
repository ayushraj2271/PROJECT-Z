name: PROJECT Z Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.0
          use-dotnet: false
          include-templates: true

      - name: Import Godot project
        run: |
          godot --headless --path . --editor --quit

      - name: Create build folder
        run: |
          mkdir -p build
          
      - name: Create Android debug keystore
        run: |
          keytool -keyalg RSA \
            -genkeypair \
            -alias androiddebugkey \
            -keypass android \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 \
            -storetype JKS
            
           - name: Build Android APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          godot --headless \
            --path . \
            --export-debug "Android" \
            build/PROJECT_Z.apk 

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PROJECT-Z-Android
          path: build/PROJECT_Z.apk
          if-no-files-found: error
