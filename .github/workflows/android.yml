name: PROJECT Z Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.0
          use-dotnet: false
          include-templates: true

      - name: Enable Android texture compression
        run: |
          sed -i '/textures\/default_filters\/use_nearest_mipmap_filter=false/a textures/vram_compression/import_etc2_astc=true' project.godot

      - name: Import Godot project
        run: |
          godot --headless --path . --editor --quit

      - name: Create build folder
        run: |
          mkdir -p build

      - name: Create Android debug keystore
        run: |
          keytool -keyalg RSA \
            -genkeypair \
            -alias androiddebugkey \
            -keypass android \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 \
            -storetype JKS

      - name: Configure Godot Android settings
        run: |
          mkdir -p ~/.config/godot

          cat > ~/.config/godot/editor_settings-4.5.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/adb = "$ANDROID_HOME/platform-tools/adb"
          export/android/jarsigner = "$JAVA_HOME/bin/jarsigner"
          export/android/debug_keystore = "$RUNNER_TEMP/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          EOF

      - name: Verify Android environment
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"

          test -d "$ANDROID_HOME/platform-tools"
          test -f "$ANDROID_HOME/platform-tools/adb"

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          test -f "$JAVA_HOME/bin/jarsigner"
          test -f "$RUNNER_TEMP/debug.keystore"

          echo "Android environment OK"

      - name: Verify Godot project
        run: |
          grep "import_etc2_astc=true" project.godot
          echo "Godot project configuration OK"

      - name: Build Android APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          godot --headless \
            --verbose \
            --path . \
            --export-debug "Android" \
            build/PROJECT_Z.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PROJECT-Z-Android
          path: build/PROJECT_Z.apk
          if-no-files-found: error
