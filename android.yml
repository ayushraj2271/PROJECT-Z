name: PROJECT Z Android Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export PROJECT Z
        uses: NodotProject/godot-export@v7.0.0
        with:
          godot_executable_download_url: https://downloads.tuxfamily.org/godotengine/4.5/Godot_v4.5-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://downloads.tuxfamily.org/godotengine/4.5/Godot_v4.5-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: true
          export_debug: true
          export_preset: "Android"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-z-android
          path: |
            build/**/*.apk
            build/**/*.aab
            .godot/**/*.apk
            .godot/**/*.aab
          if-no-files-found: warn
